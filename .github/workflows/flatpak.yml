name: Build iReal Pro Flatpak

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Flatpak Tools & Pre-fetch Runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          
          # Add Flathub system-wide
          sudo flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          
          # Pre-install runtime dependencies system-wide so flatpak-builder doesn't hit Polkit permission errors
          sudo flatpak install -y flathub org.freedesktop.Sdk//24.08 org.freedesktop.Platform//24.08

      - name: Compute RPM SHA256 Hash
        run: |
          RPM_URL="https://linux.irealpro.com/irealpro-latest.x86_64.rpm"
          echo "Fetching latest SHA256..."
          CALCULATED_HASH=$(curl -sL "$RPM_URL" | sha256sum | awk '{print $1}')
          echo "Calculated Hash: $CALCULATED_HASH"
          
          # Inject calculated hash into irealpro.yml
          sed -i "s/PLACEHOLDER_SHA256/$CALCULATED_HASH/g" irealpro.yml

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.irealpro.irealpro.flatpak
          manifest-path: irealpro.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: irealpro-flatpak
          path: com.irealpro.irealpro.flatpak
