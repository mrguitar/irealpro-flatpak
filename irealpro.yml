app-id: com.irealpro.irealpro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: irealpro

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --filesystem=host

modules:
  - name: irealpro
    buildsystem: simple
    build-commands:
      # 1. Copy extracted RPM payload to /app
      - cp -r . /app/

      # 2. Locate and install Desktop file from git repo root
      - |
        DESKTOP_FILE=$(find .. /run/build -name "com.irealpro.irealpro.desktop" 2>/dev/null | head -n 1)
        if [ -n "$DESKTOP_FILE" ]; then
          install -Dm644 "$DESKTOP_FILE" /app/share/applications/com.irealpro.irealpro.desktop
        else
          echo "Error: com.irealpro.irealpro.desktop not found!" && exit 1
        fi

      # 3. Locate and install Icon file from git repo root
      - |
        ICON_FILE=$(find .. /run/build -name "irealpro.png" -o -name "com.irealpro.irealpro.png" 2>/dev/null | head -n 1)
        if [ -n "$ICON_FILE" ]; then
          install -Dm644 "$ICON_FILE" /app/share/icons/hicolor/512x512/apps/com.irealpro.irealpro.png
        else
          echo "Error: icon PNG not found!" && exit 1
        fi

      # 4. Locate and install AppStream MetaInfo file from git repo root
      - |
        METAINFO_FILE=$(find .. /run/build -name "com.irealpro.irealpro.metainfo.xml" 2>/dev/null | head -n 1)
        if [ -n "$METAINFO_FILE" ]; then
          install -Dm644 "$METAINFO_FILE" /app/share/metainfo/com.irealpro.irealpro.metainfo.xml
        else
          echo "Error: com.irealpro.irealpro.metainfo.xml not found!" && exit 1
        fi

    sources:
      - type: archive
        url: https://linux.irealpro.com/irealpro-latest.x86_64.rpm
        sha256: PLACEHOLDER_SHA256
