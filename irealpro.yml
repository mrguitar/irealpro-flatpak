app-id: com.irealpro.irealpro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: irealpro

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --filesystem=host

modules:
  - name: irealpro
    buildsystem: simple
    build-commands:
      # 1. Copy extracted RPM contents to /app
      - cp -r . /app/

      # 2. Install Metadata & Icons from your repo into /app/share
      - install -Dm644 com.irealpro.desktop /app/share/applications/com.irealpro.desktop
      - install -Dm644 com.irealpro.metainfo.xml /app/share/metainfo/com.irealpro.metainfo.xml
      # Copy, rename, and install the 512x512 PNG icon from the RPM
      - install -Dm644 irealpro.png /app/share/icons/hicolor/512x512/apps/com.irealpro.png

    sources:
      - type: archive
        url: https://linux.irealpro.com/irealpro-latest.x86_64.rpm
        sha256: PLACEHOLDER_SHA256
