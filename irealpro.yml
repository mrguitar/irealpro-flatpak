app-id: com.irealpro.irealpro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: irealpro

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --filesystem=host

modules:
  - name: irealpro
    buildsystem: simple
    build-commands:
      # Copy extracted RPM contents to /app
      - cp -r . /app/

      # Install desktop file (dynamic find handles both repo or RPM sources)
      - |
        DESKTOP_FILE=$(find . -maxdepth 2 -name "com.irealpro.irealpro.desktop" | head -n 1)
        if [ -n "$DESKTOP_FILE" ]; then
          install -Dm644 "$DESKTOP_FILE" /app/share/applications/com.irealpro.irealpro.desktop
        else
          echo "Error: com.irealpro.irealpro.desktop not found!" && exit 1
        fi

      # Install icon
      - |
        ICON_FILE=$(find . -name "irealpro.png" -o -name "com.irealpro.png" -o -name "com.irealpro.irealpro.png" | head -n 1)
        if [ -n "$ICON_FILE" ]; then
          install -Dm644 "$ICON_FILE" /app/share/icons/hicolor/512x512/apps/com.irealpro.irealpro.png
        fi

      # Install MetaInfo file
      - |
        METAINFO_FILE=$(find . -name "*metainfo.xml" -o -name "*appdata.xml" | head -n 1)
        if [ -n "$METAINFO_FILE" ]; then
          install -Dm644 "$METAINFO_FILE" /app/share/metainfo/com.irealpro.irealpro.metainfo.xml
        fi

    sources:
      - type: archive
        url: https://linux.irealpro.com/irealpro-latest.x86_64.rpm
        sha256: PLACEHOLDER_SHA256
