app-id: com.irealpro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: irealpro

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --filesystem=host

modules:
  - name: irealpro
    buildsystem: simple
    build-commands:
      # 1. Debug step: Print directory contents so you can inspect paths if needed
      - ls -la

      # 2. Copy extracted RPM contents to /app
      - cp -r . /app/

      # 3. Locate and install desktop file dynamically from extracted RPM (or git repo)
      - |
        DESKTOP_FILE=$(find . -name "*.desktop" | head -n 1)
        if [ -n "$DESKTOP_FILE" ]; then
          install -Dm644 "$DESKTOP_FILE" /app/share/applications/com.irealpro.desktop
        fi

      # 4. Locate and install icon dynamically
      - |
        ICON_FILE=$(find . -name "irealpro.png" -o -name "com.irealpro.png" | head -n 1)
        if [ -n "$ICON_FILE" ]; then
          install -Dm644 "$ICON_FILE" /app/share/icons/hicolor/512x512/apps/com.irealpro.png
        fi

      # 5. Install your repository's AppStream MetaInfo file
      - install -Dm644 com.irealpro.metainfo.xml /app/share/metainfo/com.irealpro.metainfo.xml

    sources:
      - type: archive
        url: https://linux.irealpro.com/irealpro-latest.x86_64.rpm
        sha256: PLACEHOLDER_SHA256
