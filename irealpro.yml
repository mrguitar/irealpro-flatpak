app-id: com.irealpro.irealpro
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: irealpro

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=host
  - --share=network
  - --device=dri
  - --env=ELECTRON_TRASH=gio

modules:
  - name: irealpro
    buildsystem: simple
    build-commands:
      # 1. Copy extracted RPM payload to /app
      - cp -r . /app/

      # 2. Install Desktop file from module sources
      - install -Dm644 com.irealpro.irealpro.desktop /app/share/applications/com.irealpro.irealpro.desktop

      # 3. Install Icon file from module sources
      - install -Dm644 irealpro.png /app/share/icons/hicolor/512x512/apps/com.irealpro.irealpro.png

      # 4. Install AppStream MetaInfo file from module sources
      - install -Dm644 com.irealpro.irealpro.metainfo.xml /app/share/metainfo/com.irealpro.irealpro.metainfo.xml

      # 5. Create a wrapper script for the main executable in /app/bin
      - mkdir -p /app/bin
      - |
        cat << 'EOF' > /app/bin/irealpro
        #!/bin/sh
        # Automatically select native Wayland if available, falling back to X11 seamlessly
        exec /app/iRealPro/irealpro --no-sandbox --ozone-platform-hint=auto "$@"
        EOF
      - chmod +x /app/bin/irealpro

    sources:
      - type: archive
        url: https://linux.irealpro.com/irealpro-latest.x86_64.rpm
        sha256: PLACEHOLDER_SHA256
      - type: file
        path: com.irealpro.irealpro.desktop
      - type: file
        path: irealpro.png
      - type: file
        path: com.irealpro.irealpro.metainfo.xml
